{% extends "base.html" %}
{% block titulo %}Entrar | {{ cfg.loja_nome }}{% endblock %}
{% block conteudo %}
<div class="auth-caixa">
  <form method="post" class="bloco">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h1>Entrar</h1>
    <p class="sub">Use o login e a senha da sua conta de vendedor, cliente ou entregador.</p>
    <div class="campo"><label for="login">Login</label><input id="login" name="login" required maxlength="10" autocomplete="username" autofocus value="{{ login or '' }}"></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required maxlength="10" autocomplete="current-password"></div>
    <button class="btn btn-verde btn-bloco">Entrar</button>
    <p class="auth-rodape">Ainda não tem conta? <a class="link" href="{{ url_for('auth.escolher_cadastro') }}">Crie a sua</a></p>
  </form>
</div>
{% endblock %}
